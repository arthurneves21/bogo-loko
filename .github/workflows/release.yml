name: Publicar release

# Dispara quando o arquivo VERSION muda no main. O próprio GitHub cria a tag
# BogoLokov<versão> e o release com o .exe (o código-fonte fica fora do repo).

on:
  push:
    branches: [ main ]
    paths: [ 'VERSION' ]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "ver=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Criar release e anexar o .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: BogoLokov${{ steps.v.outputs.ver }}
          name: BogoLokov${{ steps.v.outputs.ver }}
          files: BogoLoko.exe
          fail_on_unmatched_files: true
